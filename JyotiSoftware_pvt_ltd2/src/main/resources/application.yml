server:
  port: ${PORT:9090}

spring:
  datasource:
    # In Render, set SPRING_DATASOURCE_URL/USERNAME/PASSWORD env vars.
    # Local fallback points to your local DB.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/JYOTI_WEBSITES}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximumPoolSize: 5
      # optional: don't fail app init instantly if DB is momentarily unavailable
      initializationFailTimeout: 0
      connectionTimeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
