server:
  port: 9090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/JYOTI_WEBSITES
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
