services:
  - type: web
    name: jyoti-software-company
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    healthCheckPath: /

    buildFilter:
      paths:
        - Dockerfile
        - render.yaml
        - JyotiSoftware_pvt_ltd/**

    envVars:
      # ✅ Use your Render Postgres (internal) creds
      - key: DB_HOST
        value: dpg-d2s1p9nfte5s739ftvp0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: jyoti_software_services
      - key: DB_USER
        value: jyoti_software_services_user
      - key: DB_PASS
        value: 7ndmr2HzMdAaGmMAlmmERn81TzEBOWlw

      # JVM memory tune for small container
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError

      # Keep Java 17 if you build on Render without Docker; harmless here
      - key: JAVA_VERSION
        value: "17"
