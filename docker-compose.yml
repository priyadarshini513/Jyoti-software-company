services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: JYOTI_WEBSITES
      MYSQL_ROOT_PASSWORD: root
    command: ["--default-authentication-plugin=mysql_native_password"]
    # either remove ports entirely, or map to 3307 to avoid conflicts:
    # ports:
    #   - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      retries: 10
      timeout: 5s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/JYOTI_WEBSITES?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # remove if not used in your application*.yml via ${HIBERNATE_DIALECT}
      # HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
    ports:
      - "8080:9090"
    restart: unless-stopped

volumes:
  mysqldata:
